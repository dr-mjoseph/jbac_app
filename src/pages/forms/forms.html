<ion-header>
  <ion-navbar>
    <ion-buttons end>
      <button ion-button (click)="gotohome()">
        <ion-icon style="font-size: 20px;" name="home"></ion-icon>
      </button>
    </ion-buttons>
    <ion-title style="text-align: center;"><b>రిజిస్ట్రేషన్</b></ion-title>
  </ion-navbar>
</ion-header>

<ion-content class="pagecss">
  <br>
  <ion-card class="hesd" tappable (click)="gotopage(1)">
    <ion-card-header tappable (click)="gotopage(1)">
      బిలీవర్ రిజిస్టర్
    </ion-card-header>
  </ion-card>
  <ion-card class="hesd" tappable (click)="gotopage(2)">
    <ion-card-header tappable (click)="gotopage(2)">
      విద్యార్థుల రిజిస్టర్
    </ion-card-header>
  </ion-card>
  <ion-card class="hesd" tappable (click)="gotopage(3)">
    <ion-card-header tappable (click)="gotopage(3)">
      మినిస్ట్రీ రిజిస్టర్
    </ion-card-header>
  </ion-card>
  <ion-card class="hesd" tappable (click)="gotopage(4)">
    <ion-card-header tappable (click)="gotopage(4)">
      పాస్టర్ రిజిస్టర్
    </ion-card-header>
  </ion-card>
  <ion-card class="hesd" tappable (click)="gotopage(5)">
    <ion-card-header tappable (click)="gotopage(5)">
      చర్చి రిజిస్టర్
    </ion-card-header>
  </ion-card>
  <ion-card class="hesd" tappable (click)="gotopage(6)">
    <ion-card-header tappable (click)="gotopage(6)">
      సంస్థ రిజిస్టర్
    </ion-card-header>
  </ion-card>
  <ion-card class="hesd" tappable (click)="gotopage(7)">
    <ion-card-header tappable (click)="gotopage(7)">
      పాస్టర్ అసోసియేషన్ రిజిస్టర్
    </ion-card-header>
  </ion-card>
  <ion-card class="hesd" tappable (click)="gotopage(8)" style="border-left: 5px solid #00548F; background: linear-gradient(135deg, #e0f2fe, #ffffff);">
    <ion-card-header tappable (click)="gotopage(8)" style="color: #00548F; font-weight: bold;">
      🩺 డాక్టర్ / కౌన్సిలర్ రిజిస్టర్ (Doctor Register)
    </ion-card-header>
  </ion-card>
</ion-content>
