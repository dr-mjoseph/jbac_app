<ion-header>
  <ion-navbar>
    <ion-buttons end>
      <button ion-button (click)="gotohome()">
        <ion-icon style="font-size: 20px;" name="home"></ion-icon>
      </button>
    </ion-buttons>
    <ion-title style="text-align: center;"><b>Video-Gallery</b></ion-title>
  </ion-navbar>
</ion-header>

<ion-content padding class="pagecss">

  <div *ngFor="let o of filteredData">
    <br>
    <p style="color: white; display: flex; justify-content: space-between; text-transform: capitalize;">
      <span>{{o.category_nm}}</span>
      <span (click)="opensub(o.category_id)">More</span>
    </p>

    <div style="text-align: center;">
      <iframe [src]="o.banner_url | youtube" allow="autoplay; encrypted-media"
        style="height:250px;width:333px"></iframe>
    </div>
  </div>
