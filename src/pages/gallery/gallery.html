<ion-header>
  <ion-navbar>
    <ion-buttons end>
      <button ion-button (click)="gotohome()">
        <ion-icon style="font-size: 20px;" name="home"></ion-icon>
      </button>
    </ion-buttons>
    <ion-title style="text-align: center;"><b>ఫోటో గేలరీ</b></ion-title>
  </ion-navbar>
</ion-header>

<ion-content class="pagecss">

  <ion-row>

    <ion-col col-12 *ngFor="let gt of imagesget" style="text-align: center;">
      <img style="height: 200px; max-width: 100%; object-fit: cover; border-radius: 8px;" [src]="gt.image" (error)="onImgError($event, gt)" (click)="gotosub(gt.id)">
      <h3 style="color:white;">{{gt.categoryname}}</h3>
    </ion-col>

    <ion-col col-12 *ngIf="imagesget && imagesget.length === 0" style="text-align: center; padding: 40px 16px;">
      <ion-icon name="images" style="font-size: 48px; color: #ffeb3b;"></ion-icon>
      <p style="color: white; font-size: 18px;">ప్రస్తుతానికి ఫోటోలు ఏవీ లేవు</p>
    </ion-col>

  </ion-row>

</ion-content>
