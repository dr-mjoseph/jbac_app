<ion-header>
  <ion-navbar>
    <ion-buttons end>
      <button ion-button (click)="gotohome()">
        <ion-icon style="font-size: 20px;" name="home"></ion-icon>
      </button>
    </ion-buttons>
    <ion-title style="text-align: center;"><b>సహాయం కోరండి</b></ion-title>
  </ion-navbar>
</ion-header>


<ion-content padding class="pagecss">
  <form [formGroup]="form">
    <ion-row>
      <ion-col col-12>
        <ion-item>
          <ion-label stacked>పేరు <span style="color:red;">*</span></ion-label>
          <ion-input type="text" formControlName="name" placeholder="మీ పూర్తి పేరు నమోదు చేయండి"></ion-input>
        </ion-item>
      </ion-col>
      <ion-col col-12>
        <ion-item>
          <ion-label stacked>మొబైల్ నంబర్ <span style="color:red;">*</span></ion-label>
          <ion-input type="tel" maxlength="10" formControlName="mobile_number" placeholder="10 అంకెల మొబైల్ నంబర్"></ion-input>
        </ion-item>
      </ion-col>
      <ion-col col-12>
        <ion-item>
          <ion-label stacked>చిరునామా <span style="color:red;">*</span></ion-label>
          <ion-textarea formControlName="address" placeholder="పూర్తి చిరునామా నమోదు చేయండి"></ion-textarea>
        </ion-item>
      </ion-col>
      <ion-col col-12>
        <ion-item>
          <ion-label stacked>సహాయం రకం <span style="color:red;">*</span></ion-label>
          <ion-select formControlName="help" placeholder="సహాయం ఎంచుకోండి">
            <ion-option value="" disabled selected>సహాయం ఎంచుకోండి</ion-option>
            <ion-option value="CommunitySupport Help">కమ్యూనిటీ సహాయం</ion-option>
            <ion-option value="Education Help">విద్య సహాయం</ion-option>
            <ion-option value="Financial Help">ఆర్థిక సహాయం</ion-option>
            <ion-option value="ForChurchConstruction Help">చర్చి నిర్మాణం కొరకు సహాయం</ion-option>
            <ion-option value="Legal Help">న్యాయ సహాయం</ion-option>
            <ion-option value="Medical Help">వైద్య సహాయం</ion-option>
            <ion-option value="PoliceDepartmental Help">పోలీస్ డిపార్ట్‌మెంట్ సహాయం</ion-option>
            <ion-option value="Political Help">రాజకీయ సహాయం</ion-option>
            <ion-option value="Other Help">ఇతర సహాయం</ion-option>
          </ion-select>
        </ion-item>
      </ion-col>
      <ion-col col-12>
        <ion-item>
          <ion-label stacked>సహాయ వివరాలు / వివరణ <span style="color:red;">*</span></ion-label>
          <ion-textarea formControlName="description" placeholder="మీకు అవసరమైన సహాయం గురించి వివరంగా రాయండి"></ion-textarea>
        </ion-item>
      </ion-col>
      <ion-col col-12>
        <div class="imgerdt" style="padding: 12px; text-align: center; border: 2px dashed #00548F; border-radius: 8px; background: #fafafa;">
          <img src="assets/icon/upload.svg" style="height: 60px; width: 60px; display: block; margin: 0 auto 6px;">
          <p style="margin: 4px 0 10px; font-weight: bold; color: #00548F; font-size: 14px;">చిత్రం అప్‌లోడ్ (ఐచ్ఛికం / Optional)</p>
          <input type="file" (change)="onFileSelected($event)" accept="image/*" style="display: block; width: 100%; max-width: 290px; margin: 0 auto 10px; padding: 6px; background: #fff; border: 1px solid #ccc; border-radius: 4px;">
          <button ion-button small outline icon-start type="button" (click)="openphoto()" style="margin: 0 auto; display: inline-block;">
            <ion-icon name="camera"></ion-icon> Camera / Gallery
          </button>
          <div *ngIf="imagesdata.length" style="margin-top: 12px;">
            <img style="max-height: 200px; max-width: 100%; border-radius: 8px; border: 1px solid #00548F;" [src]="imagesdata[0].reviewimg || imagesdata[0].reviewImg">
          </div>
        </div>
      </ion-col>
      <ion-col col-12 style="text-align: center; margin-top: 15px;">
        <button ion-button color="secondary" block (click)="postmeetings()" style="letter-spacing: 1px; font-weight: bold;">సమర్పించండి</button>
      </ion-col>

    </ion-row>
  </form>

</ion-content>
