name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Java (JDK 8)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'

    - name: Clean Preview Android SDK Platforms & Unset NDK
      run: |
        echo "Taking ownership of Android SDK..."
        sudo chown -R $USER:$USER /usr/local/lib/android/sdk

        echo "Removing NDK, system images, sources, emulator..."
        sudo rm -rf /usr/local/lib/android/sdk/ndk* /usr/local/lib/android/sdk/system-images /usr/local/lib/android/sdk/sources /usr/local/lib/android/sdk/cmake /usr/local/lib/android/sdk/emulator /usr/local/lib/android/sdk/extras || true
        echo "ANDROID_NDK_HOME=" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=" >> $GITHUB_ENV

        echo "Removing all platforms except android-28..."
        find /usr/local/lib/android/sdk/platforms/ -mindepth 1 -maxdepth 1 ! -name 'android-28' -exec sudo rm -rf {} + || true

        echo "Removing all build-tools except 30.0.3..."
        find /usr/local/lib/android/sdk/build-tools/ -mindepth 1 -maxdepth 1 ! -name '30.0.3' -exec sudo rm -rf {} + || true

        echo "Purging any remaining files containing 34x or extension-level..."
        grep -rl "34x" /usr/local/lib/android/sdk 2>/dev/null | while read -r file; do
          echo "Removing $file directory: $(dirname "$file")"
          rm -rf "$(dirname "$file")"
        done || true

        grep -rl "extension-level" /usr/local/lib/android/sdk 2>/dev/null | while read -r file; do
          echo "Removing $file directory: $(dirname "$file")"
          rm -rf "$(dirname "$file")"
        done || true

        sudo chmod -R 777 /usr/local/lib/android/sdk

    - name: Install Android Build Tools 30.0.3
      run: |
        if [ ! -f /usr/local/lib/android/sdk/build-tools/30.0.3/aapt ]; then
          curl -fsSL https://dl.google.com/android/repository/build-tools_r30.0.3-linux.zip -o /tmp/build-tools.zip
          unzip -q /tmp/build-tools.zip -d /tmp/build-tools
          sudo mkdir -p /usr/local/lib/android/sdk/build-tools/30.0.3
          sudo cp -r /tmp/build-tools/android-11/* /usr/local/lib/android/sdk/build-tools/30.0.3/
        fi
        cat << 'EOF' > /usr/local/lib/android/sdk/build-tools/30.0.3/package.xml
<?xml version="1.0" encoding="UTF-8" standalone="yes"?><ns2:repository xmlns:ns2="http://schemas.android.com/repository/android/common/01" xmlns:ns3="http://schemas.android.com/repository/android/generic/01"><license id="android-sdk-license" type="text">Terms and Conditions</license><localPackage path="build-tools;30.0.3" obsolete="false"><type-details xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:type="ns3:genericDetailsType"/><revision><major>30</major><minor>0</minor><micro>3</micro></revision><display-name>Android SDK Build-Tools 30.0.3</display-name><uses-license ref="android-sdk-license"/></localPackage></ns2:repository>
EOF
        sudo chmod -R 777 /usr/local/lib/android/sdk/build-tools/30.0.3
        echo "=== Installed Build Tools ==="
        ls -la /usr/local/lib/android/sdk/build-tools/30.0.3/aapt

    - name: Install Gradle 4.10.3
      run: |
        curl -fsSL https://services.gradle.org/distributions/gradle-4.10.3-bin.zip -o /tmp/gradle-4.10.3.zip
        sudo unzip -q /tmp/gradle-4.10.3.zip -d /opt
        sudo chmod -R a+rx /opt/gradle-4.10.3
        echo "/opt/gradle-4.10.3/bin" >> $GITHUB_PATH

    - name: Verify Toolchain
      run: |
        java -version
        /opt/gradle-4.10.3/bin/gradle -v
        ls -la /usr/local/lib/android/sdk/build-tools/30.0.3/

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '14'
        cache: npm

    - name: Use compatible npm
      run: npm install -g npm@6

    - name: Install Global Dependencies
      run: npm install -g ionic@5.4.16 cordova@11.1.0

    - name: Install Project Dependencies
      run: |
        npm config set production false
        npm install --production=false

    - name: Patch Cordova Android Templates
      run: |
        node scripts/patch-android-build.js

    - name: Compile Ionic Web Assets
      run: |
        npm run build

    - name: Add Android Platform
      run: |
        cordova platform add android --no-interactive
        node scripts/patch-android-build.js
        if [ -f platforms/android/cdv-gradle-config.json ]; then
          node -e '
            const fs = require("fs");
            const file = "platforms/android/cdv-gradle-config.json";
            const cfg = JSON.parse(fs.readFileSync(file, "utf8"));
            cfg.BUILD_TOOLS_VERSION = "30.0.3";
            fs.writeFileSync(file, JSON.stringify(cfg, null, 2));
            console.log("Updated cdv-gradle-config.json:", cfg);
          ' || true
        fi

    - name: Build Android Release Package
      env:
        CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL: "https://services.gradle.org/distributions/gradle-4.10.3-all.zip"
      run: |
        set -o pipefail
        cordova build android --release --verbose -- --packageType=apk --gradleArg=-PcdvBuildToolsVersion=30.0.3 --gradleArg=-PcdvTargetSdkVersion=36 --gradleArg=-PcdvVersionCode=46 2>&1 | tee cordova_build.log || {
          echo "Build failed, pushing log to build-log-branch..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-log-branch
          git add -f cordova_build.log
          git commit -m "ci: capture cordova build error log"
          git push origin build-log-branch --force
          cat cordova_build.log | tail -n 100
          exit 1
        }

    - name: Sign Android Release APK
      run: |
        ALIGN="/usr/local/lib/android/sdk/build-tools/30.0.3/zipalign"
        SIGNER="/usr/local/lib/android/sdk/build-tools/30.0.3/apksigner"
        RAW_APK=$(find platforms/android/app/build/outputs/apk/release/ -type f -name "*.apk" ! -name "*unaligned*" | head -n 1)
        ALIGNED="platforms/android/app/build/outputs/apk/release/app-release-aligned.apk"
        SIGNED="platforms/android/app/build/outputs/apk/release/app-release.apk"

        echo "Found raw APK: $RAW_APK"
        echo "Aligning APK..."
        $ALIGN -f -p 4 "$RAW_APK" "$ALIGNED"

        echo "Signing APK with Jbac.keystore..."
        $SIGNER sign --ks Jbac.keystore --ks-pass pass:123456 --ks-key-alias jbac --key-pass pass:123456 --min-sdk-version 21 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$SIGNED" "$ALIGNED"

        echo "Verifying signature..."
        $SIGNER verify --verbose "$SIGNED"
        ls -la "$SIGNED"

    - name: List Build Outputs
      run: find platforms/android/app/build/outputs/ -type f || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release.apk
        path: platforms/android/app/build/outputs/apk/release/app-release.apk